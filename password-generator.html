<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #0f0f1a;
    --border: #00ff9d;
    --glow: #00ff9d;
    --accent: #ff003c;
    --text: #e0ffe0;
    --dim: #4a6a4a;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 20px;
    position: relative;
    z-index: 10;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--glow);
    text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow);
    animation: flicker 4s infinite;
  }

  .header p {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 3px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.4; }
    97% { opacity: 1; }
    98% { opacity: 0.2; }
    99% { opacity: 1; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid rgba(0,255,157,0.3);
    padding: 28px;
    position: relative;
    box-shadow: 0 0 30px rgba(0,255,157,0.05), inset 0 0 30px rgba(0,0,0,0.5);
  }

  .panel::before {
    content: '';
    position: absolute;
    top: -1px; left: 20px;
    width: 60px; height: 2px;
    background: var(--glow);
    box-shadow: 0 0 10px var(--glow);
  }

  .panel::after {
    content: '';
    position: absolute;
    bottom: -1px; right: 20px;
    width: 60px; height: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  /* Password display */
  .password-display {
    background: #050508;
    border: 1px solid rgba(0,255,157,0.2);
    padding: 18px 16px;
    margin-bottom: 24px;
    position: relative;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .password-display::before {
    content: '> OUTPUT';
    position: absolute;
    top: -9px; left: 12px;
    font-size: 10px;
    color: var(--dim);
    background: #050508;
    padding: 0 6px;
    letter-spacing: 2px;
  }

  #password-text {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--glow);
    word-break: break-all;
    flex: 1;
    text-shadow: 0 0 8px rgba(0,255,157,0.5);
    letter-spacing: 1px;
  }

  #password-text.placeholder {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 2px;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid rgba(0,255,157,0.3);
    color: var(--glow);
    padding: 8px 12px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    background: rgba(0,255,157,0.1);
    box-shadow: 0 0 10px rgba(0,255,157,0.2);
  }

  .copy-btn.copied {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px rgba(255,0,60,0.3);
  }

  /* Strength bar */
  .strength-section {
    margin-bottom: 24px;
  }

  .strength-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  #strength-value {
    color: var(--glow);
    transition: color 0.3s;
  }

  .strength-bar {
    height: 4px;
    background: rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    transition: width 0.4s ease, background 0.4s ease;
    box-shadow: 0 0 8px currentColor;
  }

  /* Length slider */
  .control-group {
    margin-bottom: 20px;
  }

  .control-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  #length-value {
    color: var(--glow);
    font-size: 13px;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 2px;
    background: rgba(0,255,157,0.15);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--bg);
    border: 2px solid var(--glow);
    cursor: pointer;
    box-shadow: 0 0 8px var(--glow);
    transition: box-shadow 0.2s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 16px var(--glow);
  }

  /* Checkboxes */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 10px 12px;
    border: 1px solid rgba(0,255,157,0.1);
    transition: all 0.2s;
    user-select: none;
  }

  .option-item:hover {
    border-color: rgba(0,255,157,0.3);
    background: rgba(0,255,157,0.03);
  }

  .option-item input[type="checkbox"] {
    display: none;
  }

  .checkbox-custom {
    width: 14px;
    height: 14px;
    border: 1px solid var(--dim);
    position: relative;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option-item input:checked ~ .checkbox-custom {
    border-color: var(--glow);
    background: rgba(0,255,157,0.1);
    box-shadow: 0 0 6px rgba(0,255,157,0.4);
  }

  .option-item input:checked ~ .checkbox-custom::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    color: var(--glow);
  }

  .option-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
    transition: color 0.2s;
    text-transform: uppercase;
  }

  .option-item:has(input:checked) .option-label {
    color: var(--text);
  }

  /* Generate button */
  .generate-btn {
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1px solid var(--glow);
    color: var(--glow);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,255,157,0.1);
  }

  .generate-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,157,0.15), transparent);
    transition: left 0.4s;
  }

  .generate-btn:hover::before {
    left: 100%;
  }

  .generate-btn:hover {
    background: rgba(0,255,157,0.08);
    box-shadow: 0 0 30px rgba(0,255,157,0.25);
    text-shadow: 0 0 10px var(--glow);
  }

  .generate-btn:active {
    transform: scale(0.98);
  }

  /* Corner decorations */
  .corner {
    position: absolute;
    width: 10px;
    height: 10px;
  }
  .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--glow); border-left: 2px solid var(--glow); }
  .corner-tr { top: -1px; right: -1px; border-top: 2px solid var(--glow); border-right: 2px solid var(--glow); }
  .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--glow); border-left: 2px solid var(--glow); }
  .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--glow); border-right: 2px solid var(--glow); }

  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
  }

  /* Typing animation */
  @keyframes typing {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .char {
    display: inline;
    animation: typing 0.05s ease forwards;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>// PASS_GEN</h1>
    <p>Secure Password Generator</p>
  </div>

  <div class="panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Password Output -->
    <div class="password-display">
      <span id="password-text" class="placeholder">AWAITING GENERATION...</span>
      <button class="copy-btn" id="copy-btn" onclick="copyPassword()">[ COPY ]</button>
    </div>

    <!-- Strength -->
    <div class="strength-section">
      <div class="strength-label">
        <span>STRENGTH</span>
        <span id="strength-value">—</span>
      </div>
      <div class="strength-bar">
        <div class="strength-fill" id="strength-fill"></div>
      </div>
    </div>

    <!-- Length -->
    <div class="control-group">
      <div class="control-label">
        <span>LENGTH</span>
        <span id="length-value">16</span>
      </div>
      <input type="range" id="length-slider" min="6" max="64" value="16"
        oninput="document.getElementById('length-value').textContent = this.value">
    </div>

    <!-- Options -->
    <div class="options-grid">
      <label class="option-item">
        <input type="checkbox" id="opt-upper" checked>
        <div class="checkbox-custom"></div>
        <span class="option-label">Uppercase</span>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-lower" checked>
        <div class="checkbox-custom"></div>
        <span class="option-label">Lowercase</span>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-numbers" checked>
        <div class="checkbox-custom"></div>
        <span class="option-label">Numbers</span>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-symbols" checked>
        <div class="checkbox-custom"></div>
        <span class="option-label">Symbols</span>
      </label>
    </div>

    <!-- Generate -->
    <button class="generate-btn" onclick="generatePassword()">
      [ GENERATE ]
    </button>
  </div>

  <div class="footer">
    YOUR FIRST PROJECT &nbsp;|&nbsp; BUILT WITH JS
  </div>
</div>

<script>
  const CHARS = {
    upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:   'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  let currentPassword = '';

  function generatePassword() {
    const length = parseInt(document.getElementById('length-slider').value);
    const useUpper   = document.getElementById('opt-upper').checked;
    const useLower   = document.getElementById('opt-lower').checked;
    const useNumbers = document.getElementById('opt-numbers').checked;
    const useSymbols = document.getElementById('opt-symbols').checked;

    let charset = '';
    let guaranteed = [];

    if (useUpper)   { charset += CHARS.upper;   guaranteed.push(randomChar(CHARS.upper)); }
    if (useLower)   { charset += CHARS.lower;   guaranteed.push(randomChar(CHARS.lower)); }
    if (useNumbers) { charset += CHARS.numbers; guaranteed.push(randomChar(CHARS.numbers)); }
    if (useSymbols) { charset += CHARS.symbols; guaranteed.push(randomChar(CHARS.symbols)); }

    if (!charset) {
      animateText('SELECT AT LEAST ONE OPTION', true);
      return;
    }

    // Build password with guaranteed chars
    let password = [...guaranteed];
    for (let i = guaranteed.length; i < length; i++) {
      password.push(randomChar(charset));
    }

    // Shuffle
    for (let i = password.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [password[i], password[j]] = [password[j], password[i]];
    }

    currentPassword = password.join('');
    animateText(currentPassword, false);
    updateStrength(currentPassword, useUpper, useLower, useNumbers, useSymbols);

    // Reset copy button
    const btn = document.getElementById('copy-btn');
    btn.textContent = '[ COPY ]';
    btn.classList.remove('copied');
  }

  function randomChar(str) {
    return str[Math.floor(Math.random() * str.length)];
  }

  function animateText(text, isError) {
    const el = document.getElementById('password-text');
    el.innerHTML = '';
    el.classList.remove('placeholder');

    if (isError) {
      el.classList.add('placeholder');
      el.textContent = text;
      return;
    }

    // Animate chars one by one
    [...text].forEach((char, i) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = char;
      span.style.animationDelay = `${i * 30}ms`;
      span.style.opacity = '0';
      el.appendChild(span);
    });
  }

  function updateStrength(password, upper, lower, numbers, symbols) {
    const length = password.length;
    const typesUsed = [upper, lower, numbers, symbols].filter(Boolean).length;

    let score = 0;
    if (length >= 8)  score += 1;
    if (length >= 12) score += 1;
    if (length >= 20) score += 1;
    if (length >= 32) score += 1;
    if (typesUsed >= 2) score += 1;
    if (typesUsed >= 3) score += 1;
    if (typesUsed === 4) score += 1;

    const levels = [
      { label: 'WEAK',      color: '#ff003c', pct: 15 },
      { label: 'WEAK',      color: '#ff003c', pct: 25 },
      { label: 'FAIR',      color: '#ff8c00', pct: 40 },
      { label: 'FAIR',      color: '#ff8c00', pct: 55 },
      { label: 'GOOD',      color: '#ffe000', pct: 68 },
      { label: 'STRONG',    color: '#00ff9d', pct: 82 },
      { label: 'STRONG',    color: '#00ff9d', pct: 92 },
      { label: 'UNBREAKABLE', color: '#00ff9d', pct: 100 },
    ];

    const lvl = levels[Math.min(score, levels.length - 1)];
    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-value');

    fill.style.width = lvl.pct + '%';
    fill.style.background = lvl.color;
    fill.style.color = lvl.color;
    label.textContent = lvl.label;
    label.style.color = lvl.color;
  }

  function copyPassword() {
    if (!currentPassword) return;
    navigator.clipboard.writeText(currentPassword).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '[ COPIED! ]';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '[ COPY ]';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Generate on load
  generatePassword();
</script>
</body>
</html>
